@font-face {

:root {

  --bg-card: rgba(18, 18, 26, 0.85);

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  background: var(--bg-deep);
  color: var(--text-main);
  font-family: var(--font-sans);
  overflow: hidden;
  user-select: none;
}

#stage-container {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 40%, #151522 0%, #08080c 75%, #030305 100%);
}

#video-canvas {
  width: 100%;
  height: 100%;
  max-width: 100vw;
  max-height: 56.25vw; /* 16:9 */
  aspect-ratio: 16 / 9;
  object-fit: contain;
  box-shadow: 0 0 60px rgba(0, 0, 0, 0.8), 0 0 100px rgba(0, 229, 255, 0.08);
  display: block;
  background: #000;
}

@media (min-aspect-ratio: 16/9) {
  #video-canvas {
    max-width: 177.78vh;
    max-height: 100vh;
  }
}

#hud-header {
  position: absolute;
  top: 18px;
  left: 24px;
  right: 24px;
  display: flex;
  align-items: center;

.hud-pill {

const loadedImages = {};

function preloadImages() {
  const entries = Object.entries(IMAGES);
  let loaded = 0;
  entries.forEach(([k, src]) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      loaded++;
      loadedImages[k] = img;
      if (loaded === entries.length) imagesReady = true;
    };
    img.onerror = () => {
      loaded++;
      console.warn("Failed to load image asset:", src);
      if (loaded === entries.length) imagesReady = true;
    };
    img.src = src;
  });
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  const ms = Math.floor((sec % 1) * 10);
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}.${ms}`;
}

// 3. Audio Engine & Synthesizer Soundtrack
// ---------------------------------------------------------------------
let audioCtx = null;
let audioMaster = null;
let audioDest = null;
let audioMuted = false;
let isAudioInitialized = false;

const BPM = 116;
const BEAT_DUR = 60 / BPM;
const SIXTEENTH = BEAT_DUR / 4;

function initAudio() {
  if (isAudioInitialized) return;
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AudioContext({ sampleRate: 48000 });

  audioMaster = audioCtx.createGain();
  audioMaster.gain.setValueAtTime(0.85, audioCtx.currentTime);

  const compressor = audioCtx.createDynamicsCompressor();
  compressor.threshold.setValueAtTime(-14, audioCtx.currentTime);
  compressor.knee.setValueAtTime(10, audioCtx.currentTime);
  compressor.ratio.setValueAtTime(4, audioCtx.currentTime);
  compressor.attack.setValueAtTime(0.005, audioCtx.currentTime);
  compressor.release.setValueAtTime(0.12, audioCtx.currentTime);

  audioMaster.connect(compressor);
  compressor.connect(audioCtx.destination);

  audioDest = audioCtx.createMediaStreamDestination();
  compressor.connect(audioDest);

  isAudioInitialized = true;
}

function playClick(t) {
  if (!audioCtx || audioMuted) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(180, t);
  osc.frequency.exponentialRampToValueAtTime(30, t + 0.04);
  gain.gain.setValueAtTime(0.9, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
  osc.connect(gain);
  gain.connect(audioMaster);
  osc.start(t);
  osc.stop(t + 0.06);
}

function playLEDSparkleChime(t, pitchOffset = 0) {
  if (!audioCtx || audioMuted) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "triangle";
  osc.frequency.setValueAtTime(523.25 * Math.pow(2, pitchOffset / 12), t);
  gain.gain.setValueAtTime(0.001, t);
  gain.gain.linearRampToValueAtTime(0.15, t + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
  osc.connect(gain);
  gain.connect(audioMaster);
  osc.start(t);
  osc.stop(t + 0.4);
}

function playBootChord(t) {
  if (!audioCtx || audioMuted) return;
  const freqs = [146.83, 174.61, 220.00, 261.63, 329.63, 440.00];
  freqs.forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    const filter = audioCtx.createBiquadFilter();
    const gain = audioCtx.createGain();

    osc.type = i % 2 === 0 ? "sawtooth" : "triangle";
    osc.frequency.setValueAtTime(f + (Math.random() - 0.5) * 0.8, t);

    filter.type = "lowpass";
    filter.frequency.setValueAtTime(600, t);
    filter.frequency.exponentialRampToValueAtTime(3200, t + 1.2);
    filter.frequency.exponentialRampToValueAtTime(800, t + 3.0);
    filter.Q.setValueAtTime(3.5, t);

    gain.gain.setValueAtTime(0.001, t);
    gain.gain.linearRampToValueAtTime(0.08, t + 0.15);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 3.4);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioMaster);
    osc.start(t);
    osc.stop(t + 3.5);
  });
}

function playSubDrop(t) {
  if (!audioCtx || audioMuted) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(140, t);
  osc.frequency.exponentialRampToValueAtTime(28, t + 1.8);

  gain.gain.setValueAtTime(0.01, t);
  gain.gain.linearRampToValueAtTime(0.6, t + 0.08);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 2.0);

  osc.connect(gain);
  gain.connect(audioMaster);
  osc.start(t);
  osc.stop(t + 2.1);
}

let nextBarTime = 0;
let barCounter = 0;

const CHORD_PROGRESSION = [
  [146.83, 220.00, 261.63, 329.63],
  [116.54, 233.08, 293.66, 349.23],
  [98.00, 196.00, 293.66, 349.23],
  [130.81, 196.00, 261.63, 329.63]
];

const BASS_ROOTS = [73.42, 58.27, 49.00, 65.41];

function scheduleBar(t, barIdx) {
  if (!audioCtx || audioMuted) return;
  const chordIdx = barIdx % 4;
  const chord = CHORD_PROGRESSION[chordIdx];
  const bassRoot = BASS_ROOTS[chordIdx];

  chord.forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    const filter = audioCtx.createBiquadFilter();
    const gain = audioCtx.createGain();

    osc.type = i === 0 ? "sawtooth" : "triangle";
    osc.frequency.setValueAtTime(f + (i * 0.4), t);

    filter.type = "lowpass";
    filter.frequency.setValueAtTime(1400, t);
    filter.frequency.linearRampToValueAtTime(2200, t + 2 * BEAT_DUR);
    filter.frequency.linearRampToValueAtTime(1200, t + 4 * BEAT_DUR);
    filter.Q.setValueAtTime(1.5, t);

    gain.gain.setValueAtTime(0.001, t);
    gain.gain.linearRampToValueAtTime(0.05, t + 0.3);
    gain.gain.setValueAtTime(0.045, t + 3.6 * BEAT_DUR);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 4 * BEAT_DUR);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioMaster);
    osc.start(t);
    osc.stop(t + 4 * BEAT_DUR);
  });

  for (let s = 0; s < 16; s++) {
    const stepTime = t + s * SIXTEENTH;
    const osc = audioCtx.createOscillator();
    const filter = audioCtx.createBiquadFilter();
    const gain = audioCtx.createGain();

    const oct = (s === 3 || s === 7 || s === 11 || s === 14) ? 2 : 1;
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(bassRoot * oct, stepTime);

    filter.type = "lowpass";
    filter.frequency.setValueAtTime(350, stepTime);
    filter.frequency.exponentialRampToValueAtTime(1200, stepTime + 0.02);
    filter.frequency.exponentialRampToValueAtTime(320, stepTime + SIXTEENTH * 0.8);
    filter.Q.setValueAtTime(4.0, stepTime);

    const vol = (s % 4 === 0) ? 0.22 : 0.14;
    gain.gain.setValueAtTime(vol, stepTime);
    gain.gain.exponentialRampToValueAtTime(0.001, stepTime + SIXTEENTH * 0.75);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioMaster);
    osc.start(stepTime);
    osc.stop(stepTime + SIXTEENTH);
  }

  const arpNotes = [chord[0] * 2, chord[2] * 2, chord[1] * 2, chord[3] * 2, chord[2] * 2, chord[0] * 2, chord[3] * 2, chord[1] * 2];
  for (let s = 0; s < 16; s++) {
    const stepTime = t + s * SIXTEENTH;
    const noteFreq = arpNotes[s % arpNotes.length];

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(noteFreq, stepTime);

    gain.gain.setValueAtTime(0.001, stepTime);
    gain.gain.linearRampToValueAtTime(0.045, stepTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, stepTime + SIXTEENTH * 1.5);

    osc.connect(gain);
    gain.connect(audioMaster);
    osc.start(stepTime);
    osc.stop(stepTime + SIXTEENTH * 1.6);
  }

  for (let beat = 0; beat < 4; beat++) {
    const beatTime = t + beat * BEAT_DUR;

    const kickOsc = audioCtx.createOscillator();
    const kickGain = audioCtx.createGain();
    kickOsc.frequency.setValueAtTime(130, beatTime);
    kickOsc.frequency.exponentialRampToValueAtTime(38, beatTime + 0.12);
    kickGain.gain.setValueAtTime(0.42, beatTime);
    kickGain.gain.exponentialRampToValueAtTime(0.001, beatTime + 0.22);
    kickOsc.connect(kickGain);
    kickGain.connect(audioMaster);
    kickOsc.start(beatTime);
    kickOsc.stop(beatTime + 0.25);

    if (beat === 1 || beat === 3) {
      const snareOsc = audioCtx.createOscillator();
      const snareGain = audioCtx.createGain();
      snareOsc.type = "triangle";
      snareOsc.frequency.setValueAtTime(190, beatTime);
      snareOsc.frequency.exponentialRampToValueAtTime(80, beatTime + 0.1);
      snareGain.gain.setValueAtTime(0.2, beatTime);
      snareGain.gain.exponentialRampToValueAtTime(0.001, beatTime + 0.14);
      snareOsc.connect(snareGain);
      snareGain.connect(audioMaster);
      snareOsc.start(beatTime);
      snareOsc.stop(beatTime + 0.15);
    }
  }
}

let lastColdOpenTrigger = -1;
function updateAudioClock(playheadTime) {
  if (!audioCtx) return;

  if (playheadTime >= 0.8 && playheadTime < 1.0 && lastColdOpenTrigger < 0.8) {
    playClick(audioCtx.currentTime);
    lastColdOpenTrigger = 0.8;
  }
  if (playheadTime >= 3.0 && playheadTime < 3.2 && lastColdOpenTrigger < 3.0) {
    for (let i = 0; i < 6; i++) {
      playLEDSparkleChime(audioCtx.currentTime + i * 0.18, i * 2);
    }
    lastColdOpenTrigger = 3.0;
  }
  if (playheadTime >= 6.0 && playheadTime < 6.2 && lastColdOpenTrigger < 6.0) {
    playBootChord(audioCtx.currentTime);
    lastColdOpenTrigger = 6.0;
  }
  if (playheadTime >= 9.0 && playheadTime < 9.2 && lastColdOpenTrigger < 9.0) {
    playSubDrop(audioCtx.currentTime);
    lastColdOpenTrigger = 9.0;
  }

  if (playheadTime >= 12.0) {
    const elapsedSinceGroove = playheadTime - 12.0;
    const currentBar = Math.floor(elapsedSinceGroove / (4 * BEAT_DUR));
    if (currentBar !== barCounter) {
      barCounter = currentBar;
      scheduleBar(audioCtx.currentTime, barCounter);
    }
  } else {
    barCounter = -1;
  }
}

function getSlideAtTime(t) {
  for (let i = SLIDES.length - 1; i >= 0; i--) {
    if (t >= SLIDES[i].startTime) return { slide: SLIDES[i], index: i };
  }
  return { slide: SLIDES[0], index: 0 };

// ---------------- Cold Open Renderer ----------------
function renderColdOpen(t, slide) {
  ctx.fillStyle = "#06060A";
  ctx.fillRect(0, 0, 1920, 1080);

  const grad = ctx.createRadialGradient(960, 540, 100, 960, 540, 900);
  grad.addColorStop(0, "rgba(22, 22, 34, 0.45)");
  grad.addColorStop(1, "rgba(2, 2, 4, 0.95)");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1920, 1080);

  ctx.save();

  // Screen coordinate setup:
  const devX = 460, devY = 240, devW = 1000, devH = 620;
  const scrX = devX + 380, scrY = devY + 50, scrS = 240; // scrX=840, scrY=290

  // The center of the bootscreen logo grid (between threads GX 109 & 131 and GY 56 & 66)
  // Inside the 240x240 screen, x=120, y=61 is the empty black space in the center!
  const zoomTargetX = scrX + 120; // 960
  const zoomTargetY = scrY + 61;  // 351

  if (t >= 9.0) {
    const zoomProgress = (t - 9.0) / 3.0; // 0..1
    const easeZoom = Math.pow(zoomProgress, 3.4);
    const scale = 1.0 + easeZoom * 38.0;

    // Zoom directly into the empty black space at the center of the logo grid!
    ctx.translate(zoomTargetX, zoomTargetY);
    ctx.scale(scale, scale);
    ctx.translate(-zoomTargetX, -zoomTargetY);

    if (zoomProgress > 0.85) {
      const fadeOut = (zoomProgress - 0.85) / 0.15;
      ctx.globalAlpha = Math.max(0, 1 - fadeOut);
    }
  }

  // Draw Loom FM-1 Device Chassis
  ctx.fillStyle = "#18181D";
  ctx.strokeStyle = "#2D2D35";
  ctx.lineWidth = 3;
  roundRect(ctx, devX, devY, devW, devH, 32, true, true);

  // Screen Bezel
  ctx.fillStyle = "#0A0A0D";
  ctx.strokeStyle = "#383842";
  ctx.lineWidth = 2;
  roundRect(ctx, scrX - 6, scrY - 6, scrS + 12, scrS + 12, 14, true, true);

  // 8 Rotary Knobs
  const knobCoords = [
    [devX + 90, devY + 110], [devX + 190, devY + 110],
    [devX + 90, devY + 210], [devX + 190, devY + 210],
    [devX + 710, devY + 110], [devX + 795, devY + 110],
    [devX + 880, devY + 110], [devX + 965, devY + 110]
  ];
  knobCoords.forEach(([kx, ky], idx) => {
    ctx.fillStyle = "#101013";
    ctx.beginPath();
    ctx.arc(kx, ky, 24, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#3A3A42";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.strokeStyle = "#E0E0E6";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    const ang = -2.2 + idx * 0.6;
    ctx.moveTo(kx, ky);
    ctx.lineTo(kx + Math.cos(ang) * 18, ky + Math.sin(ang) * 18);
    ctx.stroke();
  });

  // Power Switch & Label
  const pwrX = devX + 70, pwrY = devY + 265;
  ctx.fillStyle = "#111116";
  roundRect(ctx, pwrX, pwrY, 60, 28, 6, true, false);
  ctx.font = "bold 11px DotGothic16, monospace";
  ctx.fillStyle = "#777785";
  ctx.fillText("POWER", pwrX + 10, pwrY - 8);

  const isSwitchOn = t >= 0.8;
  ctx.fillStyle = isSwitchOn ? "#39FF14" : "#44444C";
  roundRect(ctx, isSwitchOn ? pwrX + 32 : pwrX + 4, pwrY + 4, 24, 20, 4, true, false);
  if (isSwitchOn) {
    ctx.shadowColor = "#39FF14";
    ctx.shadowBlur = 12;
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(pwrX + 38, pwrY + 8, 12, 12);
    ctx.shadowBlur = 0;
  }

  // Keybed: Monochrome / White Sparkling Wave
  const keybedX = devX + 40, keybedY = devY + 360, keybedW = devW - 80;
  const numKeys = 16;
  const keyW = (keybedW - 20) / numKeys;

  // Active sparkling wave (3-5 keys wide) traveling across monochrome white keys
  const sweepPos = t >= 3.0 ? ((t - 3.0) / 2.5) * 18 - 1 : -10;

  for (let k = 0; k < numKeys; k++) {
    const kx = keybedX + 10 + k * keyW;
    const ky = keybedY + 20;

    ctx.fillStyle = "#222228";
    roundRect(ctx, kx + 2, ky, keyW - 6, 180, 8, true, false);

    const slitX = kx + keyW / 2 - 2;
    let alpha = 0.15;
    let isLit = false;

    if (t >= 3.0) {
      const dist = Math.abs(k - sweepPos);
      if (dist <= 2.2) {
        // Active sparkle wave 3-5 keys wide
        const sparkle = 0.55 + 0.45 * Math.sin(k * 7.7 + t * 26.0);
        alpha = Math.max(0.3, sparkle * (1.0 - dist / 2.5));
        isLit = true;
      } else if (t >= 5.5) {
        // Standby breath
        alpha = 0.35 + 0.12 * Math.sin(t * 3.0);
        isLit = true;
      }
    }

    const ledColor = `rgba(255, 255, 255, ${alpha.toFixed(2)})`;
    ctx.fillStyle = ledColor;
    if (isLit) {
      ctx.shadowColor = "#FFFFFF";
      ctx.shadowBlur = 14 * alpha;
    }
    roundRect(ctx, slitX, ky + 15, 5, 140, 3, true, false);
    ctx.shadowBlur = 0;
  }

  // 240x240 LCD Screen (Powers on at t=6.0)
  if (t >= 6.0) {
    ctx.save();
    ctx.beginPath();
    roundRect(ctx, scrX, scrY, scrS, scrS, 10, false, false);
    ctx.clip();

    ctx.fillStyle = "#050709";
    ctx.fillRect(scrX, scrY, scrS, scrS);

    // Render authentic bootscreen with animated wavy threads
    renderBootscreenContent(scrX, scrY, scrS, t);

    // CRT Scanlines
    ctx.fillStyle = "rgba(255, 255, 255, 0.04)";
    for (let line = 0; line < scrS; line += 4) {
      ctx.fillRect(scrX, scrY + line, scrS, 1.5);
    }

    ctx.restore();
  }

  ctx.restore();

  if (t < 9.0) {
    ctx.font = "bold 22px DotGothic16, monospace";
    ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
    ctx.textAlign = "center";
    ctx.fillText("LOOM FM-1 · HARDWARE INITIALIZATION", 960, 960);
    ctx.font = "14px -apple-system, sans-serif";
    ctx.fillStyle = "#00E5FF";
    ctx.fillText("5-TRACK TEXTILE SYNTHESIZER & GROOVEBOX", 960, 990);
    ctx.textAlign = "left";
  }
}

// Pixel-perfect Loom Bootscreen Renderer (ui_draw.c)
function renderBootscreenContent(ox, oy, size, curTime) {
  const scale = size / 240;
  const GX = [65, 87, 109, 131, 153, 175];
  const GY = [36, 46, 56, 66, 76, 86];

  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(scale, scale);

  // 1. Horizontal weft threads
  for (let j = 0; j < 6; j++) {
    const y = GY[j];
    const grad = ctx.createLinearGradient(65, y, 175, y);
    LOOM_COLORS.forEach((col, idx) => grad.addColorStop(idx / 5, col));
    ctx.fillStyle = grad;
    ctx.fillRect(65, y, 110, 3);
  }

  // 2. Vertical warp threads
  for (let i = 0; i < 6; i++) {
    ctx.fillStyle = LOOM_COLORS[i];
    ctx.fillRect(GX[i], 36, 3, 52);
  }

  // 3. Woven over/under textile depth
  for (let j = 0; j < 6; j++) {
    const y = GY[j];
    for (let i = 0; i < 6; i++) {
      const x = GX[i];
      if ((i + j) % 2 === 1) {
        ctx.fillStyle = LOOM_COLORS[i];
        ctx.fillRect(x - 2, y, 7, 3);
        ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
        ctx.fillRect(x, y - 1, 3, 1);
        ctx.fillRect(x, y + 3, 3, 1);
      } else {
        ctx.fillStyle = LOOM_COLORS[i];
        ctx.fillRect(x - 2, y - 2, 3, 7);
        ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
        ctx.fillRect(x - 1, y, 1, 3);
        ctx.fillRect(x + 3, y, 1, 3);
      }
    }
  }

  // 4. Squiggly wavy yarn ends (with subtle animated sinusoidal drift)
  ctx.lineWidth = 2.5;
  const timeDrift = (curTime - 6.0) * 2.2;

  for (let i = 0; i < 6; i++) {
    const x = GX[i];
    ctx.strokeStyle = LOOM_COLORS[i];
    ctx.beginPath();
    ctx.moveTo(x + 1.5, 36);
    const dir = i < 3 ? -1 : 1;
    const amp = 4 + (i < 3 ? i : 5 - i);
    for (let p = 1; p <= 10; p++) {
      const cy = 36 - 2 * p;
      const cx = x + 1.5 + dir * (Math.sin(p * 0.7 + timeDrift) * amp + p * 0.5);
      ctx.lineTo(cx, cy);
    }
    ctx.stroke();
  }

  for (let i = 0; i < 6; i++) {
    const x = GX[i];
    ctx.strokeStyle = LOOM_COLORS[i];
    ctx.beginPath();
    ctx.moveTo(x + 1.5, 87);
    const dir = i < 3 ? -1 : 1;
    const amp = 4 + (i < 3 ? (2 - i) : (i - 3));
    for (let p = 1; p <= 10; p++) {
      const cy = 87 + 2 * p;
      const cx = x + 1.5 + dir * (Math.sin(p * 0.7 + timeDrift) * amp + p * 0.5);
      ctx.lineTo(cx, cy);
    }
    ctx.stroke();
  }

  for (let j = 0; j < 6; j++) {
    const y = GY[j];
    ctx.strokeStyle = LOOM_COLORS[j];
    ctx.beginPath();
    ctx.moveTo(65, y + 1.5);
    const dir = j < 3 ? -1 : 1;
    const amp = 3 + (j < 3 ? j : 5 - j);
    for (let p = 1; p <= 10; p++) {
      const cx = 65 - 2 * p;
      const cy = y + 1.5 + dir * (Math.sin(p * 0.7 + timeDrift) * amp + p * 0.5);
      ctx.lineTo(cx, cy);
    }
    ctx.stroke();
  }

  for (let j = 0; j < 6; j++) {
    const y = GY[j];
    ctx.strokeStyle = LOOM_COLORS[j];
    ctx.beginPath();
    ctx.moveTo(175, y + 1.5);
    const dir = j < 3 ? -1 : 1;
    const amp = 3 + (j < 3 ? (2 - j) : (j - 3));
    for (let p = 1; p <= 10; p++) {
      const cx = 175 + 2 * p;
      const cy = y + 1.5 + dir * (Math.sin(p * 0.7 + timeDrift) * amp + p * 0.5);
      ctx.lineTo(cx, cy);
    }
    ctx.stroke();
  }

  // 5. Glowing Loom Orange accent bar
  ctx.fillStyle = "#FF4500";
  ctx.shadowColor = "#FF4500";
  ctx.shadowBlur = 10;
  roundRect(ctx, 80, 126, 80, 3, 1.5, true, false);
  ctx.shadowBlur = 0;

  // 6. Typography
  ctx.font = "bold 28px DotGothic16, monospace";
  ctx.fillStyle = "#FFFFFF";
  ctx.textAlign = "center";
  ctx.fillText("L  O  O  M", 120, 165);

  ctx.font = "bold 11px DotGothic16, monospace";
  ctx.fillStyle = "#00E5FF";
  ctx.fillText("GROOVEBOX · FM-1", 120, 185);

  ctx.restore();
}

// ---------------- Standard Slide Renderer ----------------
function renderStandardSlide(slide, elapsedInSlide, index) {
  const theme = slide.themeColor || "#00E5FF";
  const accent = slide.accentColor || "#BD00FF";

  ctx.fillStyle = "#08080E";
  ctx.fillRect(0, 0, 1920, 1080);

  const bgGrad = ctx.createRadialGradient(1400, 480, 50, 1400, 480, 800);
  bgGrad.addColorStop(0, hexToRgba(theme, 0.16));
  bgGrad.addColorStop(0.5, hexToRgba(accent, 0.05));
  bgGrad.addColorStop(1, "rgba(8, 8, 14, 0)");
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, 1920, 1080);

  ctx.strokeStyle = "rgba(255, 255, 255, 0.03)";
  ctx.lineWidth = 1;
  for (let x = 0; x < 1920; x += 80) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1080); ctx.stroke();
  }
  for (let y = 0; y < 1080; y += 80) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1920, y); ctx.stroke();
  }

  // Top Category Badge & Header Bar
  ctx.save();
  const badgeX = 90, badgeY = 70;
  ctx.fillStyle = hexToRgba(theme, 0.15);
  ctx.strokeStyle = hexToRgba(theme, 0.6);
  ctx.lineWidth = 1.5;
  roundRect(ctx, badgeX, badgeY, 340, 36, 18, true, true);

  ctx.font = "bold 12.5px DotGothic16, monospace";
  ctx.fillStyle = theme;
  ctx.fillText(slide.chapter, badgeX + 22, badgeY + 23);

  ctx.font = "14px DotGothic16, monospace";
  ctx.fillStyle = "#707085";
  ctx.textAlign = "right";
  ctx.fillText(`SCENE ${String(index + 1).padStart(2, "0")} / ${SLIDES.length}  ·  ${formatTime(playhead)}`, 1830, badgeY + 23);
  ctx.textAlign = "left";

  // Slide Title (Neon Glow)
  ctx.font = "bold 50px -apple-system, BlinkMacSystemFont, sans-serif";
  ctx.shadowColor = theme;
  ctx.shadowBlur = 24;
  ctx.fillStyle = "#FFFFFF";
  ctx.fillText(slide.title, 90, 175);
  ctx.shadowBlur = 0;

  // Subtitle
  ctx.font = "500 20px -apple-system, BlinkMacSystemFont, sans-serif";
  ctx.fillStyle = "#C2C2D4";
  ctx.fillText(slide.subtitle, 92, 218);

  // Left Content Column (Bullets & Parameters)
  const colX = 90, startY = 275;
  if (slide.bullets) {
    slide.bullets.forEach((bullet, bIdx) => {
      const by = startY + bIdx * 62;

      ctx.fillStyle = theme;
      ctx.shadowColor = theme;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(colX + 8, by - 6);
      ctx.lineTo(colX + 16, by);
      ctx.lineTo(colX + 8, by + 6);
      ctx.lineTo(colX, by);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.font = "400 19px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillStyle = "#EAEAEA";
      ctx.fillText(bullet, colX + 32, by + 6);
    });
  }

  // Key Parameters / Live Controls Badges
  if (slide.params) {
    const paramY = 560;
    ctx.font = "bold 13px DotGothic16, monospace";
    ctx.fillStyle = "#888899";
    ctx.fillText("KEY PARAMETERS & LIVE CONTROLS:", colX, paramY);

    let px = colX;
    slide.params.forEach((param, pIdx) => {
      ctx.font = "bold 13px DotGothic16, monospace";
      const txtWidth = ctx.measureText(param).width;
      const pw = txtWidth + 24;

      ctx.fillStyle = "rgba(22, 22, 34, 0.85)";
      ctx.strokeStyle = hexToRgba(pIdx % 2 === 0 ? theme : accent, 0.55);
      ctx.lineWidth = 1.5;
      roundRect(ctx, px, paramY + 14, pw, 34, 10, true, true);

      ctx.fillStyle = pIdx % 2 === 0 ? theme : accent;
      ctx.fillText(param, px + 12, paramY + 36);

      px += pw + 12;
    });
  }

  // Audio Waveform Reactive Visualizer Bar
  renderWaveformVisualizer(colX, 660, 780, 110, theme, accent);

  // Right Column: Graphic Display Frame (Width ~860px, Height ~620px)
  const frameX = 970, frameY = 160, frameW = 860, frameH = 620;

  ctx.fillStyle = "rgba(16, 16, 26, 0.75)";
  ctx.strokeStyle = hexToRgba(theme, 0.45);
  ctx.lineWidth = 2;
  ctx.shadowColor = hexToRgba(theme, 0.25);
  ctx.shadowBlur = 30;
  roundRect(ctx, frameX, frameY, frameW, frameH, 24, true, true);
  ctx.shadowBlur = 0;

  const innerX = frameX + 24, innerY = frameY + 24, innerW = frameW - 48, innerH = frameH - 48;
  ctx.save();
  ctx.beginPath();
  roundRect(ctx, innerX, innerY, innerW, innerH, 16, false, false);
  ctx.clip();

  if (slide.type === "outro") {
    renderOutroConvergence(innerX, innerY, innerW, innerH, elapsedInSlide);
  } else if (slide.vectorType) {
    renderProceduralVectorDisplay(innerX, innerY, innerW, innerH, slide.vectorType, theme, accent, elapsedInSlide);
  } else if (slide.image && loadedImages[slide.image]) {
    const img = loadedImages[slide.image];
    const zoom = 1.0 + Math.sin(elapsedInSlide * 0.3) * 0.02;
    const imgW = img.naturalWidth || img.width || 800;
    const imgH = img.naturalHeight || img.height || 600;
    const imgAspect = imgW / imgH;
    const frameAspect = innerW / innerH;
    let baseW, baseH;
    if (imgAspect > frameAspect) {
      baseW = innerW;
      baseH = innerW / imgAspect;
    } else {
      baseH = innerH;
      baseW = innerH * imgAspect;
    }
    const drawW = baseW * zoom;
    const drawH = baseH * zoom;
    const drawX = innerX + (innerW - drawW) / 2;
    const drawY = innerY + (innerH - drawH) / 2;
    ctx.drawImage(img, drawX, drawY, drawW, drawH);

    const gloss = ctx.createLinearGradient(innerX, innerY, innerX, innerY + innerH);
    gloss.addColorStop(0, "rgba(255, 255, 255, 0.08)");
    gloss.addColorStop(0.3, "rgba(255, 255, 255, 0.0)");
    gloss.addColorStop(1, "rgba(0, 0, 0, 0.45)");
    ctx.fillStyle = gloss;
    ctx.fillRect(innerX, innerY, innerW, innerH);
  }

  ctx.restore();

  // Bottom Timeline Neon Bar
  const progWidth = (playhead / totalDuration) * 1920;
  const barGrad = ctx.createLinearGradient(0, 1074, 1920, 1074);
  barGrad.addColorStop(0, "#00E5FF");
  barGrad.addColorStop(0.35, "#BD00FF");
  barGrad.addColorStop(0.7, "#FF007F");
  barGrad.addColorStop(1, "#39FF14");
  ctx.fillStyle = barGrad;
  ctx.fillRect(0, 1074, progWidth, 6);

  ctx.restore();
}

// Procedural Oscilloscope & Display Engine
function renderProceduralVectorDisplay(x, y, w, h, type, theme, accent, time) {
  ctx.fillStyle = "#0A0B10";
  ctx.fillRect(x, y, w, h);

  ctx.strokeStyle = "rgba(0, 229, 255, 0.08)";
  ctx.lineWidth = 1;
  for (let gx = x; gx < x + w; gx += 40) {
    ctx.beginPath(); ctx.moveTo(gx, y); ctx.lineTo(gx, y + h); ctx.stroke();
  }
  for (let gy = y; gy < y + h; gy += 40) {
    ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x + w, gy); ctx.stroke();
  }

  const cx = x + w / 2, cy = y + h / 2;

  if (type === "analog") {
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = theme;
    ctx.shadowColor = theme;
    ctx.shadowBlur = 16;
    ctx.beginPath();
    for (let px = 0; px < w - 60; px += 4) {
      const ph = px * 0.03 + time * 3.5;
      const wave = Math.sin(ph) * 0.6 + Math.sin(ph * 2) * 0.3;
      const py = cy - 40 + wave * 90;
      if (px === 0) ctx.moveTo(x + 30 + px, py);
      else ctx.lineTo(x + 30 + px, py);
    }
    ctx.stroke();

    ctx.strokeStyle = accent;
    ctx.shadowColor = accent;
    ctx.beginPath();
    for (let px = 0; px < w - 60; px += 4) {
      const norm = px / (w - 60);
      const cutoff = 0.55 + Math.sin(time * 1.2) * 0.15;
      const slope = norm < cutoff ? 1.0 : Math.exp(-(norm - cutoff) * 9);
      const py = cy + 180 - slope * 130;
      if (px === 0) ctx.moveTo(x + 30 + px, py);
      else ctx.lineTo(x + 30 + px, py);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
    drawMiniBadge(x + 30, y + 30, "DUAL OSC (SAW + SUB)", theme);
    drawMiniBadge(x + 30, y + 65, "24dB/OCT LADDER FILTER", accent);
  }
  else if (type === "phase") {
    ctx.lineWidth = 3;
    ctx.strokeStyle = theme;
    ctx.shadowColor = theme;
    ctx.shadowBlur = 14;
    ctx.beginPath();
    for (let px = 0; px < w - 60; px += 3) {
      const phi = (px / (w - 60)) * Math.PI * 4;
      const dist = Math.sin(time * 2.0) * 0.7 + 0.8;
      const distortedPhi = phi + dist * Math.sin(phi);
      const wave = Math.sin(distortedPhi);
      const py = cy + wave * 110;
      if (px === 0) ctx.moveTo(x + 30 + px, py);
      else ctx.lineTo(x + 30 + px, py);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
    drawMiniBadge(x + 30, y + 30, "PHASE DISTORTION MORPH", theme);
  }
  else if (type === "lofi") {
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = theme;
    ctx.shadowColor = theme;
    ctx.shadowBlur = 12;
    const bits = 4;
    const levels = Math.pow(2, bits);
    ctx.beginPath();
    const stepSize = 18;
    for (let px = 0; px < w - 60; px += stepSize) {
      const ph = px * 0.02 + time * 2;
      const raw = Math.sin(ph);
      const quant = Math.round(raw * (levels / 2)) / (levels / 2);
      const py = cy + quant * 120;
      if (px === 0) ctx.moveTo(x + 30 + px, py);
      else {
        ctx.lineTo(x + 30 + px, py);
        ctx.lineTo(x + 30 + px + stepSize, py);
      }
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
    drawMiniBadge(x + 30, y + 30, "4-BIT QUANTIZATION & DECIMATION", theme);
  }
  else if (type === "voice") {
    ctx.lineWidth = 3;
    ctx.strokeStyle = theme;
    ctx.shadowColor = theme;
    ctx.shadowBlur = 14;
    ctx.beginPath();
    for (let px = 0; px < w - 60; px += 4) {
      const f1 = 0.3 + Math.sin(time * 1.5) * 0.15;
      const f2 = 0.7 + Math.cos(time * 1.2) * 0.12;
      const norm = px / (w - 60);
      const peak1 = Math.exp(-Math.pow((norm - f1) * 8, 2));
      const peak2 = Math.exp(-Math.pow((norm - f2) * 9, 2)) * 0.8;
      const py = cy + 120 - (peak1 + peak2) * 200;
      if (px === 0) ctx.moveTo(x + 30 + px, py);
      else ctx.lineTo(x + 30 + px, py);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
    drawMiniBadge(x + 30, y + 30, "VOWEL FORMANT CAVITIES (F1 / F2)", theme);
  }
  else if (type === "sample") {
    // PCM Sample Engine Waveform Preview with Start/End Trim & Loop
    ctx.font = "bold 13px DotGothic16, monospace";
    ctx.fillStyle = "#A0A0B2";
    ctx.fillText("SAMPLE ENGINE · STEREO WAVEFORM & TRIM DISPLAY", x + 30, y + 40);

    const waveX = x + 30, waveY = y + 70, waveW = w - 60, waveH = h - 140;
    ctx.fillStyle = "rgba(10, 10, 18, 0.9)";
    ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
    ctx.lineWidth = 1.5;
    roundRect(ctx, waveX, waveY, waveW, waveH, 12, true, true);

    // Center horizontal baseline
    const midY = waveY + waveH / 2;
    ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(waveX, midY); ctx.lineTo(waveX + waveW, midY);
    ctx.stroke();
    ctx.setLineDash([]);

    // Start & End Trim Markers (16% and 82%)
    const trimStart = waveX + waveW * 0.16;
    const trimEnd = waveX + waveW * 0.82;

    // Loop Fill
    ctx.fillStyle = hexToRgba(theme, 0.12);
    ctx.fillRect(trimStart, waveY + 2, trimEnd - trimStart, waveH - 4);

    // Audio Waveform Peaks
    const steps = 180;
    const stepW = waveW / steps;
    for (let s = 0; s < steps; s++) {
      const px = waveX + s * stepW;
      const inLoop = px >= trimStart && px <= trimEnd;
      const env = Math.exp(-((s - 25) * (s - 25)) / 1400) * 0.9 +
                  Math.sin(s * 0.18) * 0.25 * Math.exp(-s / 90) +
                  Math.sin(s * 0.6) * 0.15 +
                  (Math.sin(s * 1.8 + time * 0.5) * 0.08);
      const amp = Math.max(4, Math.abs(env) * (waveH * 0.42));

      ctx.fillStyle = inLoop ? (s % 2 === 0 ? theme : accent) : "rgba(255, 255, 255, 0.2)";

    ctx.font = "bold 13px DotGothic16, monospace";

    let fdbkNorm, crossNorm, tapeNorm;

    const n_dots = Math.round(3 + fdbkNorm * 13); // 3 .. 16 balls

    const half_len = (boxW * 0.44) * (1.0 - crossNorm * 0.12);
    const thickness = 2.5 + tapeNorm * 4.0; // 2.5 .. 6.5 px
    const wobble_amp = tapeNorm * 22; // 0 .. 22 px
    const n_lines = crossNorm > 0.08 ? 2 : 1;
    const maxAngle = 0.52; // ~30 degrees in radians

    const midX = boxX + boxW / 2;
    const midY = boxY + boxH / 2;

    const col_trampoline = "#FFAF32"; // Warm tape amber
    const col_dot = "#39FF14";        // Glowing neon green
    const col_core = "#FFFFFF";

    // Draw trampoline lines and bouncing balls
    for (let l = 0; l < n_lines; l++) {

      const ang = (l === 0) ? targetAngle : -targetAngle;
      const sin_ang = Math.sin(ang);
      const cos_ang = Math.cos(ang);

      const norm_x = sin_ang;
      const norm_y = -cos_ang;

      // 1. Trampoline Line with Tape Wobble
      ctx.save();
      ctx.strokeStyle = col_trampoline;
      ctx.lineWidth = thickness;
      ctx.shadowColor = col_trampoline;
      ctx.shadowBlur = 10 + tapeNorm * 12;

      ctx.beginPath();
      const numSegments = 100;
      for (let s = 0; s <= numSegments; s++) {
        const u = -half_len + (s / numSegments) * (half_len * 2);
        // Wobble oscillation along line
        const wob = wobble_amp > 0 ? Math.sin(u * 0.035 + time * 7.0 + l * 2.0) * wobble_amp : 0;
        // Position along sloped line + wobble normal
        const lx = midX + u * cos_ang + wob * norm_x;
        const ly = midY + u * sin_ang + wob * norm_y;
        if (s === 0) ctx.moveTo(lx, ly);
        else ctx.lineTo(lx, ly);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Anchor posts at the ends
      [-half_len, half_len].forEach(u => {
        const ax = midX + u * cos_ang;
        const ay = midY + u * sin_ang;
        ctx.fillStyle = "#FFFFFF";
        ctx.strokeStyle = col_trampoline;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(ax, ay, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      });
      ctx.restore();

      // 2. Bouncing Balls (1..16 dots per line)
      const dotsOnThisLine = n_lines === 1 ? n_dots : Math.ceil(n_dots * 0.85);
      const bounceFreq = 1.35;

      for (let d = 0; d < dotsOnThisLine; d++) {
        const u_norm = dotsOnThisLine === 1 ? 0 : (-0.8 + (d / (dotsOnThisLine - 1)) * 1.6);
        const u_dot = u_norm * half_len;

        // Bounce phase: staggered across dots with decay curve
        const dotPhase = (time * bounceFreq * Math.PI * 2) + (d / dotsOnThisLine) * Math.PI * 2 + (l * Math.PI * 0.5);
        const sineH = Math.abs(Math.sin(dotPhase));
        const decayFactor = Math.pow(0.96, d);
        const currentBounceH = sineH * max_bounce_h * decayFactor;

        // Wobble on trampoline at this dot's location
        const dotWob = wobble_amp > 0 ? Math.sin(u_dot * 0.035 + time * 7.0 + l * 2.0) * wobble_amp : 0;

        // Ball position (normal displacement from the line)
        const bx = midX + u_dot * cos_ang + (dotWob - currentBounceH) * norm_x;
        const by = midY + u_dot * sin_ang + (dotWob - currentBounceH) * norm_y;

        // Trampoline contact point
        const contactX = midX + u_dot * cos_ang + dotWob * norm_x;
        const contactY = midY + u_dot * sin_ang + dotWob * norm_y;

        // Impact flash when hitting the trampoline (near bottom of bounce)
        if (sineH < 0.18) {
          const hitAlpha = (1.0 - sineH / 0.18);
          ctx.strokeStyle = hexToRgba("#FFFFFF", hitAlpha * 0.9);
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(contactX, contactY, 6 + hitAlpha * 10, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Ball size & glow
        const ballSize = (8 + (1.0 - d / dotsOnThisLine) * 6);
        ctx.save();
        ctx.shadowColor = col_dot;
        ctx.shadowBlur = 12;
        ctx.fillStyle = col_dot;
        ctx.beginPath();
        ctx.arc(bx, by, ballSize / 2, 0, Math.PI * 2);
        ctx.fill();

        // White core
        ctx.fillStyle = col_core;
        ctx.beginPath();
        ctx.arc(bx, by, ballSize * 0.28, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Faint bounce trajectory dashed line
        if (sineH > 0.25) {
          ctx.strokeStyle = hexToRgba(col_dot, 0.2);
          ctx.lineWidth = 1;
          ctx.setLineDash([2, 4]);
          ctx.beginPath();
          ctx.moveTo(bx, by);
          ctx.lineTo(contactX, contactY);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }
    }

    // Dynamic Live Parameter Readouts
    const pY = boxY + boxH - 50;
    const fdbkPct = Math.round(fdbkNorm * 100);
    const crossPct = Math.round(crossNorm * 100);
    const tapePct = Math.round(tapeNorm * 100);

    drawMiniBadge(boxX + 16, pY, `FEEDBACK: ${fdbkPct}% (${n_dots} TAPS)`, col_dot);
    drawMiniBadge(boxX + 230, pY, `CROSS-DELAY: ${crossPct}% (${n_lines === 2 ? '±30° X-SLOPE' : 'CENTER'})`, crossNorm > 0.1 ? "#00E5FF" : "#888899");
    drawMiniBadge(boxX + 490, pY, `TAPE WOBBLE: ${tapePct}%`, tapeNorm > 0.1 ? col_trampoline : "#888899");

    drawMiniBadge(x + 30, y + h - 45, "PHYSICS TRAMPOLINE · PING-PONG CROSS-FEED", theme);
    drawMiniBadge(x + 500, y + h - 45, "ANALOG TAPE DRIFT & CAPSTAN MOTOR SLEW", accent);
  }
  else if (type === "reverb_cave") {
    // Large Cave Mouth in Purple Sparkling with Green & White Crystals (graph_reverb SPACE mode)
    ctx.font = "bold 13px DotGothic16, monospace";
    ctx.fillStyle = "#A0A0B2";
    ctx.fillText("SPACE REVERB CAVERN · COSMIC INFINITE DECAY & CRYSTALS", x + 30, y + 40);

    const caveW = w - 60, caveH = h - 140;
    const caveX = x + 30, caveY = y + 70;

    // Cavern bounding frame
    ctx.fillStyle = "#0A0514";
    roundRect(ctx, caveX, caveY, caveW, caveH, 14, true, false);

    const r_cave = caveW * 0.46;
    const h_cave = caveH * 0.82;
    const xc = caveX + caveW / 2;
    const y_floor = caveY + caveH - 16;

    // Cavern Interior Glow & Dark Fill
    const caveGrad = ctx.createRadialGradient(xc, y_floor - h_cave * 0.4, 20, xc, y_floor - h_cave * 0.3, r_cave * 1.1);
    caveGrad.addColorStop(0, "#4A156E");
    caveGrad.addColorStop(0.4, "#2A0A45");
    caveGrad.addColorStop(0.8, "#140523");
    caveGrad.addColorStop(1, "#07020E");

    // Cavern Roof Arch Contour
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(xc - r_cave, y_floor);
    for (let px = -r_cave; px <= r_cave; px += 8) {
      const normX = px / r_cave;
      const num = 1 - normX * normX;
      const archH = Math.sqrt(Math.max(0, num)) * h_cave;
      const rough = Math.sin(px * 0.12) * 8 + Math.cos(px * 0.28) * 5;
      const ry = y_floor - archH + rough;
      ctx.lineTo(xc + px, ry);
    }
    ctx.lineTo(xc + r_cave, y_floor);
    ctx.closePath();
    ctx.fillStyle = caveGrad;
    ctx.fill();

    // Cavern Purple Neon Arch Lip
    ctx.strokeStyle = "#BD00FF";
    ctx.lineWidth = 4;
    ctx.shadowColor = "#BD00FF";
    ctx.shadowBlur = 20;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.restore();

    // Cavern Floor
    ctx.strokeStyle = "rgba(189, 0, 255, 0.55)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(caveX, y_floor);
    ctx.lineTo(caveX + caveW, y_floor);
    ctx.stroke();

    // Rocky Floor Stalagmites
    for (let rx = xc - r_cave + 20; rx <= xc + r_cave - 20; rx += 36) {
      const smH = 10 + Math.abs(Math.sin(rx * 0.4)) * 18;
      ctx.fillStyle = "rgba(189, 0, 255, 0.4)";
      ctx.beginPath();
      ctx.moveTo(rx - 8, y_floor);
      ctx.lineTo(rx, y_floor - smH);
      ctx.lineTo(rx + 8, y_floor);
      ctx.closePath();
      ctx.fill();
    }

    // Stalactites hanging from roof arch
    const nstals = 12;
    for (let s = 0; s < nstals; s++) {
      const sx = xc - r_cave * 0.75 + (s + 0.5) * (r_cave * 1.5 / nstals);
      const normX = (sx - xc) / r_cave;
      const archH = Math.sqrt(Math.max(0, 1 - normX * normX)) * h_cave;
      const sy = y_floor - archH;
      const slen = 22 + ((s * 17) % 35);

      const stalGrad = ctx.createLinearGradient(sx, sy, sx, sy + slen);
      stalGrad.addColorStop(0, "#BD00FF");
      stalGrad.addColorStop(1, "rgba(189, 0, 255, 0.1)");
      ctx.fillStyle = stalGrad;
      ctx.beginPath();
      ctx.moveTo(sx - 7, sy);
      ctx.lineTo(sx + 7, sy);
      ctx.lineTo(sx, sy + slen);
      ctx.closePath();
      ctx.fill();

      // Glowing tip
      ctx.fillStyle = "#FFFFFF";
      ctx.beginPath();
      ctx.arc(sx, sy + slen, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // 32 Sparkling Green & White Crystals!
    const numCrystals = 32;
    for (let k = 0; k < numCrystals; k++) {
      const seed = k * 73.19;
      const kAngle = (k / numCrystals) * Math.PI;
      const kDist = 0.2 + (Math.sin(seed) * 0.5 + 0.5) * 0.72;
      const kx = xc + Math.cos(kAngle) * (r_cave * kDist);
      const ky = y_floor - Math.sin(kAngle) * (h_cave * kDist);

      const twPh = time * 4.0 + seed;
      const tw = Math.sin(twPh) * 0.5 + 0.5;
      const isGreen = k % 2 === 0;
      const crysCol = isGreen ? (tw > 0.6 ? "#00FF88" : "#39FF14") : "#FFFFFF";

      const sz = 5 + tw * 12;
      ctx.save();
      ctx.translate(kx, ky);
      ctx.fillStyle = crysCol;
      ctx.shadowColor = crysCol;
      ctx.shadowBlur = 10 + tw * 18;

      // 4-point Diamond Star Crystal
      ctx.beginPath();
      ctx.moveTo(0, -sz);
      ctx.lineTo(sz * 0.45, 0);
      ctx.lineTo(0, sz);
      ctx.lineTo(-sz * 0.45, 0);
      ctx.closePath();
      ctx.fill();

      // Starburst cross flare on bright twinkle
      if (tw > 0.4) {
        ctx.strokeStyle = "#FFFFFF";
        ctx.lineWidth = 1.5;
        const flareLen = sz * 1.6;
        ctx.beginPath();
        ctx.moveTo(0, -flareLen); ctx.lineTo(0, flareLen);
        ctx.moveTo(-flareLen, 0); ctx.lineTo(flareLen, 0);
        ctx.stroke();
      }

      ctx.restore();
    }

    drawMiniBadge(x + 30, y + h - 45, "SPACE MODE · 4 REVERB TYPES (ROOM · SPRING · HALL · SPACE)", theme);
    drawMiniBadge(x + 560, y + h - 45, "INFINITE FREEZE & MODULATED DIFFUSION", "#00FF88");
  }
  else if (type === "lfo_matrix") {
    // Track LFO Engine with 4 Preset Destinations
    ctx.font = "bold 13px DotGothic16, monospace";
    ctx.fillStyle = "#A0A0B2";
    ctx.fillText("TRACK LFO ENGINE · 4 SIMULTANEOUS PRESET DESTINATIONS", x + 30, y + 40);

    // LFO Waveform Preview Bar
    const lfoBoxY = y + 65;
    ctx.font = "bold 13px DotGothic16, monospace";
    ctx.fillStyle = theme;
    ctx.fillText("LFO WAVE: SINE / TRI / SAW / PULSE / RANDOM (TEMPO SYNC 1/4)", x + 30, lfoBoxY);

    ctx.lineWidth = 3;
    ctx.strokeStyle = theme;
    ctx.shadowColor = theme;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    for (let px = 0; px < w - 60; px += 4) {
      const py = lfoBoxY + 50 + Math.sin(px * 0.035 + time * 3.5) * 28;
      if (px === 0) ctx.moveTo(x + 30 + px, py);
      else ctx.lineTo(x + 30 + px, py);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 4 Preset Destinations
    ctx.font = "bold 13px DotGothic16, monospace";
    ctx.fillStyle = "#C0C0D0";
    ctx.fillText("4 DEDICATED PRESET DESTINATIONS PER TRACK:", x + 30, lfoBoxY + 115);

    const dests = [
      { code: "PIT", name: "PITCH DESTINATION", role: "Vibrato, octave sweeps & pitch risers", depth: "+64 (±12 ST)", col: "#00E5FF" },
      { code: "FLT", name: "FILTER CUTOFF DEST", role: "Dynamic low-pass filter sweeps & wah effects", depth: "-48 (-75%)", col: "#39FF14" },
      { code: "SHP", name: "SHAPE / TIMBRE DEST", role: "Morphs synth engine waveform & wavetable position", depth: "+52 (+81%)", col: "#BD00FF" },
      { code: "AMP", name: "AMPLITUDE DEST", role: "Rhythmic volume tremolo & gate chopping", depth: "+80 (Unipolar)", col: "#FF007F" }
    ];

    const cardW = (w - 75) / 2;
    const cardH = 88;
    dests.forEach((d, idx) => {
      const colIdx = idx % 2;
      const rowIdx = Math.floor(idx / 2);
      const cx = x + 30 + colIdx * (cardW + 15);
      const cy = lfoBoxY + 135 + rowIdx * (cardH + 14);

      ctx.fillStyle = "rgba(18, 18, 30, 0.88)";
      ctx.strokeStyle = hexToRgba(d.col, 0.6);
      ctx.lineWidth = 1.5;
      roundRect(ctx, cx, cy, cardW, cardH, 10, true, true);

      // Badge
      ctx.fillStyle = hexToRgba(d.col, 0.2);
      ctx.strokeStyle = d.col;
      roundRect(ctx, cx + 12, cy + 12, 54, 24, 6, true, true);
      ctx.font = "bold 12px DotGothic16, monospace";
      ctx.fillStyle = d.col;
      ctx.textAlign = "center";
      ctx.fillText(d.code, cx + 39, cy + 28);
      ctx.textAlign = "left";

      ctx.font = "bold 13px DotGothic16, monospace";
      ctx.fillStyle = "#FFFFFF";
      ctx.fillText(d.name, cx + 78, cy + 28);

      ctx.font = "12px -apple-system, sans-serif";
      ctx.fillStyle = "#A5A5BA";
      ctx.fillText(d.role, cx + 14, cy + 54);

      // Depth indicator bar
      ctx.font = "bold 11px DotGothic16, monospace";
      ctx.fillStyle = d.col;
      ctx.fillText(`DEPTH: ${d.depth}`, cx + 14, cy + 76);

      const dBarX = cx + 170, dBarW = cardW - 185;
      ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
      roundRect(ctx, dBarX, cy + 67, dBarW, 10, 3, true, false);
      ctx.fillStyle = d.col;
      roundRect(ctx, dBarX, cy + 67, dBarW * 0.75, 10, 3, true, false);
    });

    drawMiniBadge(x + 30, y + h - 35, "INDEPENDENT BIPOLAR DEPTHS (-64 .. +63)", theme);
    drawMiniBadge(x + 440, y + h - 35, "TEMPO SYNC · KEY TRIG · POLARITY · FADE", accent);
  }
}

// Twinkling Crystals Animation for Reverb Tank
function renderTwinklingCrystals(x, y, w, h, time) {
  const numCrystals = 22;
  for (let i = 0; i < numCrystals; i++) {
    const seed = i * 137.5;
    const cx = x + 40 + (Math.sin(seed) * 0.5 + 0.5) * (w - 80);
    const cy = y + 40 + (Math.cos(seed * 1.3) * 0.5 + 0.5) * (h - 80);
    const twinkle = Math.sin(time * 4.0 + seed) * 0.5 + 0.5;
    const size = 6 + twinkle * 10;

    const col = LOOM_COLORS[i % LOOM_COLORS.length];
    ctx.fillStyle = hexToRgba(col, 0.35 + twinkle * 0.55);
    ctx.shadowColor = col;
    ctx.shadowBlur = 12 * twinkle;

    // Diamond crystal shape
    ctx.beginPath();
    ctx.moveTo(cx, cy - size);
    ctx.lineTo(cx + size * 0.6, cy);
    ctx.lineTo(cx, cy + size);
    ctx.lineTo(cx - size * 0.6, cy);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

// Outro: Animated Convergence of Featured Screenshots & Glowing Loom Logo
function renderOutroConvergence(x, y, w, h, elapsed) {
  ctx.fillStyle = "#07080E";
  ctx.fillRect(x, y, w, h);

  const cx = x + w / 2, cy = y + h / 2;

  // Phase 1 (0.0 to 4.0s): Screenshots flying in from corners & edges
  if (elapsed < 4.0) {
    const p = elapsed / 4.0; // 0..1
    const ease = Math.pow(p, 1.8);

    const featured = ["wb_inspector", "doc_controls", "slice", "wavetable", "seq_64_8x8", "prog", "delay", "mixer"];
    const origins = [
      [-200, -200], [w + 200, -200], [-200, h + 200], [w + 200, h + 200],
      [cx, -250], [cx, h + 250], [-250, cy], [w + 250, cy]
    ];

    featured.forEach((key, idx) => {
      if (!loadedImages[key]) return;
      const img = loadedImages[key];
      const [ox, oy] = origins[idx];
      const curX = ox + (cx - ox) * ease;
      const curY = oy + (cy - oy) * ease;
      const cardW = 160 * (1 - ease * 0.4);
      const cardH = 110 * (1 - ease * 0.4);

      ctx.save();
      ctx.translate(curX, curY);
      ctx.rotate((idx - 4) * 0.15 * (1 - ease));
      ctx.globalAlpha = Math.max(0, 1.0 - ease * 0.8);
      ctx.drawImage(img, -cardW / 2, -cardH / 2, cardW, cardH);
      ctx.strokeStyle = LOOM_COLORS[idx % LOOM_COLORS.length];
      ctx.lineWidth = 2;
      roundRect(ctx, -cardW / 2, -cardH / 2, cardW, cardH, 8, false, true);
      ctx.restore();
    });

    // Central convergence vortex
    ctx.beginPath();
    ctx.arc(cx, cy, 30 + ease * 120, 0, Math.PI * 2);
    ctx.fillStyle = hexToRgba("#00E5FF", ease * 0.3);
    ctx.fill();
  }

  // Phase 2 (4.0s onwards): Fade in large, glorious glowing LOOM bootscreen logo!
  if (elapsed >= 3.2) {
    const logoAlpha = Math.min(1.0, (elapsed - 3.2) / 1.2);
    ctx.save();
    ctx.globalAlpha = logoAlpha;

    // Render large 340x340 Loom bootscreen centered
    const logoSize = 340;
    renderBootscreenContent(cx - logoSize / 2, cy - logoSize / 2 - 20, logoSize, elapsed);

    ctx.font = "bold 18px DotGothic16, monospace";
    ctx.fillStyle = "#00E5FF";
    ctx.textAlign = "center";
    ctx.fillText("LOOM GROOVEBOX · OPEN CREATIVE PLATFORM", cx, cy + 180);

    ctx.restore();
  }
}

function drawMiniBadge(bx, by, text, color) {
  ctx.fillStyle = "rgba(12, 12, 20, 0.88)";
  ctx.strokeStyle = hexToRgba(color, 0.65);
  ctx.lineWidth = 1.5;
  ctx.font = "bold 11px DotGothic16, monospace";
  const tw = ctx.measureText(text).width + 20;
  roundRect(ctx, bx, by, tw, 26, 6, true, true);

  ctx.fillStyle = color;
  ctx.fillText(text, bx + 10, by + 17);
}

function renderWaveformVisualizer(vx, vy, vw, vh, theme, accent) {
  ctx.fillStyle = "rgba(14, 14, 22, 0.75)";
  ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
  ctx.lineWidth = 1;
  roundRect(ctx, vx, vy, vw, vh, 14, true, true);

  ctx.font = "bold 11px DotGothic16, monospace";
  ctx.fillStyle = "#6E6E80";
  ctx.fillText("REAL-TIME AUDIO SPECTRUM & BUS DYNAMICS", vx + 16, vy + 22);

  const numBars = 36;
  const barW = (vw - 40) / numBars;
  for (let b = 0; b < numBars; b++) {
    const ph = b * 0.2 + playhead * 4.5;
    const mag = Math.max(6, (Math.sin(ph) * 0.5 + 0.5) * (vh - 45) * (0.4 + Math.random() * 0.6));
    const bx = vx + 20 + b * barW;
    const by = vy + vh - 15 - mag;

    const grad = ctx.createLinearGradient(bx, by + mag, bx, by);
    grad.addColorStop(0, theme);
    grad.addColorStop(1, accent);
    ctx.fillStyle = grad;
    roundRect(ctx, bx, by, barW - 4, mag, 2, true, false);
  }
}

function roundRect(context, x, y, w, h, r, fill, stroke) {
  context.beginPath();
  context.moveTo(x + r, y);
  context.lineTo(x + w - r, y);
  context.quadraticCurveTo(x + w, y, x + w, y + r);
  context.lineTo(x + w, y + h - r);
  context.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  context.lineTo(x + r, y + h);
  context.quadraticCurveTo(x, y + h, x, y + h - r);
  context.lineTo(x, y + r);
  context.quadraticCurveTo(x, y, x + r, y);
  context.closePath();
  if (fill) context.fill();
  if (stroke) context.stroke();
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

// ---------------------------------------------------------------------
// 5. Main Render Loop & Playback Controls
// ---------------------------------------------------------------------
function renderFrame(now) {
  const delta = (now - lastFrameTimestamp) / 1000;
  lastFrameTimestamp = now;

  if (isPlaying) {
    playhead += delta * playbackSpeed;
    if (playhead >= totalDuration) {
      playhead = totalDuration;
      pause();
      if (isRecording) stopRecording();
    }
  }

  updateAudioClock(playhead);

  const { slide, index } = getSlideAtTime(playhead);
  const elapsedInSlide = playhead - slide.startTime;

  if (slide.type === "cold_open") {
    renderColdOpen(elapsedInSlide, slide);
  } else {
    renderStandardSlide(slide, elapsedInSlide, index);
  }

  hudChapterTitle.textContent = slide.chapter;
  hudSlideIdx.textContent = `Slide ${index} / ${SLIDES.length - 1}`;
  timeCurrent.textContent = formatTime(playhead);
  scrubberFill.style.width = `${(playhead / totalDuration) * 100}%`;
  selectSlide.value = index;

  requestAnimationFrame(renderFrame);
}
requestAnimationFrame(renderFrame);

function play() {
  initAudio();
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  isPlaying = true;
  btnPlayPause.textContent = "⏸ Pause";
  btnPlayPause.classList.remove("primary");
}

function pause() {
  isPlaying = false;
  btnPlayPause.textContent = "▶ Play";
  btnPlayPause.classList.add("primary");
}

btnPlayPause.addEventListener("click", () => {
  if (isPlaying) pause();
  else play();
});

btnRestart.addEventListener("click", () => {
  playhead = 0.0;
  lastColdOpenTrigger = -1;
  barCounter = -1;
  play();
});

btnPrev.addEventListener("click", () => {
  const { index } = getSlideAtTime(playhead);
  if (index > 0) {
    playhead = SLIDES[index - 1].startTime;
    lastColdOpenTrigger = -1;
    barCounter = -1;
  }
});

btnNext.addEventListener("click", () => {
  const { index } = getSlideAtTime(playhead);
  if (index < SLIDES.length - 1) {
    playhead = SLIDES[index + 1].startTime;
    lastColdOpenTrigger = -1;
    barCounter = -1;
  }
});

selectSlide.addEventListener("change", (e) => {
  const idx = parseInt(e.target.value, 10);
  playhead = SLIDES[idx].startTime;
  lastColdOpenTrigger = -1;
  barCounter = -1;
});

selectSpeed.addEventListener("change", (e) => {
  playbackSpeed = parseFloat(e.target.value);
});

btnMute.addEventListener("click", () => {
  audioMuted = !audioMuted;
  btnMute.textContent = audioMuted ? "🔇 Muted" : "🔊 Audio";
  if (audioMaster && audioCtx) {
    audioMaster.gain.setValueAtTime(audioMuted ? 0 : 0.85, audioCtx.currentTime);
  }
});

let isScrubbing = false;
function seekFromEvent(e) {
  const rect = scrubberTrack.getBoundingClientRect();
  const frac = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  playhead = frac * totalDuration;
  lastColdOpenTrigger = -1;
  barCounter = -1;
}

scrubberTrack.addEventListener("pointerdown", (e) => {
  isScrubbing = true;
  scrubberTrack.setPointerCapture(e.pointerId);
  seekFromEvent(e);
});

scrubberTrack.addEventListener("pointermove", (e) => {
  if (isScrubbing) seekFromEvent(e);
});

window.addEventListener("pointerup", () => { isScrubbing = false; });
window.addEventListener("pointercancel", () => { isScrubbing = false; });

btnFullscreen.addEventListener("click", () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
});

// ---------------------------------------------------------------------
// 6. MediaRecorder 1080p 60fps Video Export Pipeline
// ---------------------------------------------------------------------
let mediaRecorder = null;
let recordedChunks = [];
let isRecording = false;

function startRecording() {
  initAudio();
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();

  playhead = 0.0;
  lastColdOpenTrigger = -1;
  barCounter = -1;
  playbackSpeed = 1.0;
  selectSpeed.value = "1";

  const videoStream = canvas.captureStream(60);
  const combinedStream = new MediaStream();

  videoStream.getVideoTracks().forEach(track => combinedStream.addTrack(track));
  if (audioDest && audioDest.stream.getAudioTracks().length > 0) {
    audioDest.stream.getAudioTracks().forEach(track => combinedStream.addTrack(track));
  }

  const mimeTypes = [
    "video/webm;codecs=vp9,opus",
    "video/webm;codecs=vp8,opus",
    "video/webm",
    "video/mp4"
  ];
  let chosenMime = mimeTypes.find(type => MediaRecorder.isTypeSupported(type)) || "";

  try {
    mediaRecorder = new MediaRecorder(combinedStream, {
      mimeType: chosenMime,
      videoBitsPerSecond: 14000000
    });
  } catch (err) {
    console.error("Failed to initialize MediaRecorder with high bitrate, falling back:", err);
    mediaRecorder = new MediaRecorder(combinedStream);
  }

  recordedChunks = [];
  mediaRecorder.ondataavailable = (e) => {
    if (e.data && e.data.size > 0) recordedChunks.push(e.data);
  };

  mediaRecorder.onstop = () => {
    isRecording = false;
    btnRecord.textContent = "🎬 Record 1080p Video";
    btnRecord.classList.remove("recording-active");
    showToast("Rendering Complete! Downloading video file...");

    const blob = new Blob(recordedChunks, { type: chosenMime || "video/webm" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "loom-fm1-groovebox-overview-1080p.webm";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  };

  mediaRecorder.start(1000);
  isRecording = true;
  btnRecord.textContent = "⏹ Stop & Save Video";
  btnRecord.classList.add("recording-active");
  showToast("Recording 1080p 60fps presentation video...");

  play();
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== "inactive") {
    mediaRecorder.stop();
  }
}

btnRecord.addEventListener("click", () => {
  if (isRecording) stopRecording();
  else startRecording();
});

let hudTimeout = null;
const hudEls = [document.getElementById("hud-header"), document.getElementById("hud-controls")];
function resetHudTimer() {
  hudEls.forEach(el => el.style.opacity = "1");
  clearTimeout(hudTimeout);
  hudTimeout = setTimeout(() => {
    if (isPlaying) {
      hudEls.forEach(el => el.style.opacity = "0");
    }
  }, 3500);
}
window.addEventListener("mousemove", resetHudTimer);
window.addEventListener("pointerdown", resetHudTimer);
resetHudTimer();

</script>
